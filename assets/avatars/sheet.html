<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Honeyguide agents · avatar sheet</title>
<!-- Params: ?theme=dark · &strip=<agent>&ts=0,0.25,... (one row, frozen at each time; for frames and GIFs)
     · · &motion=reduce · &view=context (only the page-context strip)
     · &frame=<agent>&t=<seconds> (one 96px avatar, working, frozen at t; used for frames/*.png) -->
<link rel="stylesheet" href="avatars.css">
<style>
:root{--bg:#F8F7F4;--surface:#FFFFFF;--ink:#24272B;--muted:#66717D;--faint:#868D96;--line:#E8E5DF;--ai:#5267B2;--ai-soft:#EEF0F8;--brand:#8F5A24;--amber:#B8862A;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
:root[data-theme="dark"]{--bg:#171A20;--surface:#1F232A;--ink:#F0F1F3;--muted:#A5AAB5;--faint:#7F8590;--line:#323741;--ai:#9FAEF1;--ai-soft:#252B3D;--brand:#C98348;--amber:#E2C25C}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
main{padding:28px 32px;width:max-content}
h1{font-size:20px;font-weight:650;margin:0 0 4px}
h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:650;margin:26px 0 10px}
table{border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
th,td{padding:10px 16px;text-align:center;vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted)}
td.n{text-align:left;font-weight:600;color:var(--ai);font-size:13px}
tr+tr td{border-top:1px solid var(--line)}
.sizes td{padding:10px 14px}
.sizes .hg-av{margin:0 6px}
.ctx{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;max-width:1300px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;width:372px;font-size:13px;color:var(--muted)}
.card .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:650;margin-bottom:6px}
.by{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:6px 0 4px;flex-wrap:wrap}
.by .who{color:var(--ai);font-weight:600}
.by .via{display:inline-flex;align-items:center;gap:4px}
.ans{color:var(--ink);font-size:14px;line-height:1.6;margin:2px 0 12px}
.work{display:flex;align-items:center;gap:10px;margin:8px 0 6px;font-size:13px;line-height:1.4}
.work b{color:var(--ai);font-weight:600;margin-right:4px}
code{font:12px ui-monospace,Menlo,monospace;background:color-mix(in srgb,var(--line) 60%,transparent);padding:1px 4px;border-radius:4px;color:var(--ink)}
.shim{height:8px;border-radius:6px;background:linear-gradient(90deg,var(--ai-soft) 0%,color-mix(in srgb,var(--ai) 14%,var(--surface)) 50%,var(--ai-soft) 100%);background-size:200% 100%;animation:shim 1.4s linear infinite;margin:8px 0}
@keyframes shim{to{background-position:-200% 0}}
.inl{color:var(--ink);font-size:15px;line-height:1.7;margin:4px 0}
.inl .hg-av{vertical-align:-4px;margin:0 1px}
.mini{display:flex;align-items:center;gap:3px;font-size:12.5px}
.mini span{margin-left:6px}
.note{font-size:12px;color:var(--faint);margin-top:6px}
.rm .shim{animation:none}
/* frame mode: freeze every animation at t */
.frame main{padding:8px}
.strip body,.strip main{padding:0;margin:0;background:var(--surface)}
.strip main{display:flex}
.strip .cell{width:112px;height:112px;display:flex;align-items:center;justify-content:center;flex:none}
.frame .hg-av,.frame .hg-av *{animation-play-state:paused!important;animation-delay:var(--t)!important}
</style>
<script src="hg-avatars.js"></script>
</head>
<body>
<main id="m"></main>
<script>
const P = new URLSearchParams(location.search);
const root = document.documentElement;
root.dataset.theme = P.get("theme") === "dark" ? "dark" : "light";
if (P.get("motion") === "reduce") root.classList.add("rm");
const AG = ["guide", "cartographer", "investigator", "tracer", "checker"];
const NM = { guide: "Guide", cartographer: "Cartographer", investigator: "Investigator", tracer: "Tracer", checker: "Checker" };
const ST = ["idle", "working", "done", "failed", "waiting"];
const m = document.getElementById("m");

const context = () => `
<h2>Page context</h2>
<div class="ctx">
  <div class="card"><div class="lab">Answer header (28px)</div>
    <div class="by">${hgAv("investigator", "idle", 28)}<span class="who">Investigator</span><span class="via">· answer</span></div>
    <div class="ans">The optimizer is built once in <code>train.py</code> and stepped after every batch.</div>
    <div class="by">${hgAv("tracer", "done", 28)}<span class="who">Tracer</span><span class="via">· routed by ${hgAv("guide", "idle", 20)} Guide as a flow question</span></div>
    <div class="ans">6 hops, from <code>generate()</code> to the sampled token.</div>
  </div>
  <div class="card"><div class="lab">Panel · at work (40px)</div>
    <div class="work">${hgAv("checker", "working", 40)}<div><b>Checker</b><code>re-reading model.py:12-40</code></div></div>
    <div class="work">${hgAv("investigator", "working", 40)}<div><b>Investigator</b>is working on it</div></div>
    <div class="shim" style="width:92%"></div><div class="shim" style="width:64%"></div>
    <div class="work">${hgAv("guide", "waiting", 40)}<div><b>Guide</b>waiting for <code>honeyguide watch</code></div></div>
    <div class="lab" style="margin-top:12px">Top bar, panel closed (24px)</div>
    <div class="mini">${["cartographer", "investigator", "tracer", "checker"].map(a => hgAv(a, "working", 24)).join("")}<span>4 at work</span></div>
  </div>
  <div class="card"><div class="lab">Inline in text (20px)</div>
    <p class="inl">Ask it to map the repo. The ${hgAv("cartographer", "idle static", 20)} Cartographer reads the code and saves a map in which every claim cites its lines.</p>
    <p class="inl">The ${hgAv("guide", "idle static", 20)} Guide sends it to the ${hgAv("investigator", "idle static", 20)} Investigator, or to the ${hgAv("tracer", "idle static", 20)} Tracer when it asks what happens when something runs.</p>
    <div class="note">Failed reply: ${hgAv("investigator", "failed", 20)} Couldn't answer · Retry</div>
  </div>
</div>`;

if (P.get("strip")) {
  /* a row of 112px cells, one agent frozen at each time in ts (seconds); split into frames by ffmpeg untile */
  root.classList.add("frame", "strip");
  const ts = (P.get("ts") || "0").split(",");
  m.innerHTML = ts.map(t => `<div class="cell" style="--t:-${t}s">${hgAv(P.get("strip"), P.get("state") || "working", 96)}</div>`).join("");
} else if (P.get("frame")) {
  root.classList.add("frame");
  root.style.setProperty("--t", `-${P.get("t") || 0}s`);
  m.innerHTML = hgAv(P.get("frame"), P.get("state") || "working", 96);
} else if (P.get("view") === "context") {
  m.innerHTML = context();
} else {
  const rows = AG.map(a => `<tr><td class="n">${NM[a]}</td>${ST.map(s => `<td>${hgAv(a, s, 96)}</td>`).join("")}</tr>`).join("");
  const sizes = AG.map(a => `<tr><td class="n">${NM[a]}</td>${ST.map(s => `<td>${[20, 28, 40].map(z => hgAv(a, s, z)).join("")}</td>`).join("")}</tr>`).join("");
  m.innerHTML = `<h1>Honeyguide agents<small>${root.dataset.theme} · ${root.classList.contains("rm") ? "reduced motion (still poses)" : "animations running"}</small></h1>
  <h2>States · 96px</h2>
  <table><tr><th></th>${ST.map(s => `<th>${s}</th>`).join("")}</tr>${rows}</table>
  <h2>States · 20, 28 and 40px</h2>
  <table class="sizes"><tr><th></th>${ST.map(s => `<th>${s}</th>`).join("")}</tr>${sizes}</table>
  ${context()}`;
}
</script>
</body>
</html>
