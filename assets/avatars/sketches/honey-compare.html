<!doctype html><meta charset="utf-8"><title>Honey: three directions beside the drops</title>
<style>body{margin:0;font:13px -apple-system,sans-serif;color:#24272B;background:#fff}
.v{display:flex;align-items:flex-end;gap:22px;padding:16px 28px;border-bottom:1px solid #E8E5DF}
.v.d{background:#1F232A;color:#F0F1F3}
h3{margin:0;width:150px;font-size:13px;align-self:center}
.g{display:flex;align-items:center;gap:6px}
.hdr{display:flex;align-items:center;gap:6px;font-size:12px;color:#66717D}.hdr b{color:#5267B2}
.lab{font-size:10px;color:#868D96;text-align:center}
</style>
<div id="m"></div>
<script>
const V=[["a-tuft","A · drop with swept tuft"],["b-tilt","B · family drop, tilted back"],["c-round","C · almost round, small tuft"]];
const D=["cartographer","investigator","tracer","checker"];
const img=(s,w)=>`<img src="${s}" width="${w}" height="${w}">`;
document.getElementById("m").innerHTML=V.map(([k,n])=>`<div class="v"><h3>${n}</h3>
 ${[96,40,28,20].map(z=>img(`honey-${k}.svg`,z)).join("")}
 <div><div class="lab">28px row</div><div class="g">${img(`honey-${k}.svg`,28)}${D.map(a=>img(`../${a}.svg`,28)).join("")}</div></div>
 <div><div class="lab">24px row</div><div class="g">${img(`honey-${k}.svg`,24)}${D.map(a=>img(`../${a}.svg`,24)).join("")}</div></div>
 <div><div class="lab">20px row</div><div class="g">${img(`honey-${k}.svg`,20)}${D.map(a=>img(`../${a}.svg`,20)).join("")}</div></div>
 <div class="hdr">${img(`honey-${k}.svg`,28)}<b>Guide</b> · routed</div>
</div>`).join("")+`<div class="v"><h3>old drop Guide</h3>${[96,40,28,20].map(z=>img("../guide.svg",z)).join("")}</div>`;
</script>
