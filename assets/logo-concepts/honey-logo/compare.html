<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Honeyguide logo: Honey</title>
<!-- Comparison sheet for Honey as Honeyguide's logo (assets/*.svg, written by assets/avatars/tools/build_avatars.py),
     with the comb logo B it replaces (logo-concepts/comb/b-installed/) beside it for reference. Written by hand.
     Open with ?theme=dark and/or ?view=context. favicon.svg follows the OS theme (prefers-color-scheme), so render
     the dark sheet with Chrome's --force-dark-mode (render.sh does). The "x6" column draws the icon into a real
     16/18/24px canvas and scales it up without smoothing, so it shows the pixels a browser actually paints.
     The context view copies the page's brand row (src/honeyguide/page/page.css) and draws Honey there exactly as the
     page does, with hgAv("guide", "idle", 24) from assets/avatars (static here so the shot is not mid-breath). -->
<style>
:root{--bg:#F8F7F4;--ink:#24272B;--muted:#66717D;--line:#DDD9D1;--brand:#8F5A24;--amber:#B8862A;color-scheme:light;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
:root.dark,:root[data-theme="dark"]{--bg:#171A20;--ink:#F0F1F3;--muted:#A5AAB5;--line:#3A3F49;--brand:#C98348;--amber:#E2C25C;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:22px 26px}
h1{font-size:15px;margin:0 0 12px;font-weight:650}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650;margin:20px 0 6px}
table{border-collapse:collapse}
td,th{padding:8px 12px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
td.lab{text-align:left;font-weight:600;width:200px}
td.lab small{display:block;font-weight:400;color:var(--muted)}
img{display:block;margin:auto}
canvas{display:block;margin:auto;image-rendering:pixelated;background:var(--bg)}
.zz{display:flex;gap:8px;align-items:center;justify-content:center}
.cards{display:flex;gap:16px;flex-wrap:wrap}
.card{width:230px}
.cap{font-size:11px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.1em;font-weight:650}
.side{box-sizing:border-box;width:230px;padding:28px 16px 16px 24px;border:1px solid var(--line);border-radius:8px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.7}
.brand img{margin:0;flex:none}
.repo{font:12px var(--mono);color:var(--muted);margin:2px 0 8px 30px}
.tabs{display:flex;align-items:flex-end;gap:2px;background:var(--line);padding:8px 8px 0;border-radius:8px 8px 0 0;width:max-content}
.tab{display:flex;align-items:center;gap:8px;width:190px;height:34px;padding:0 12px;box-sizing:border-box;border-radius:8px 8px 0 0;font:12px var(--sans);color:var(--muted)}
.tab.on{background:var(--bg);color:var(--ink)}
.tab img{width:16px;height:16px;margin:0}
.lock{display:flex;gap:40px;align-items:center;flex-wrap:wrap}
.brand .hg-av{margin:0}
</style>
<link rel="stylesheet" href="../../avatars/avatars.css">
<script src="../../avatars/hg-avatars.js"></script>
</head>
<body>
<div id="out"></div>
<script>
const q=new URLSearchParams(location.search), dark=q.get("theme")==="dark";
if(dark){document.documentElement.classList.add("dark");document.documentElement.dataset.theme="dark";}
const s=dark?"-dark":"";
const A="../../";
const H={icon:A+"icon"+s+".svg",small:A+"icon-small"+s+".svg",fav:A+"favicon.svg",logo:A+"logo"+s+".svg"};
const B={icon:"../comb/b-installed/icon"+s+".svg",small:"../comb/b-installed/icon-small"+s+".svg",
         fav:"../comb/b-installed/favicon.svg",logo:"../comb/b-installed/logo"+s+".svg"};
const im=(src,n)=>`<img src="${src}" width="${n}" height="${n}" alt="">`;
const zoom=(src,n)=>`<canvas data-src="${src}" width="${n}" height="${n}" style="width:${n*6}px;height:${n*6}px"></canvas>`;
const out=document.getElementById("out");
const tabs=()=>`<div class="tabs">
    <div class="tab on"><img src="${H.fav}" alt="">Honeyguide · tinytrain</div>
    <div class="tab"><img src="${H.fav}" alt="">Honeyguide · other map</div>
    <div class="tab"><img src="${H.small}" alt="">Full face at 16</div>
    <div class="tab"><img src="${B.fav}" alt="">B favicon (before)</div></div>`;
if(q.get("view")==="context"){
  let h=`<h1>Sidebar brand row and browser tab (${dark?"dark":"light"}), real size</h1><div class="cards">`;
  const card=(cap,icon,n)=>`<div class="card"><div class="cap">${cap}</div><div class="side">
    <div class="brand">${icon}<span>Honeyguide</span></div><div class="repo" style="margin-left:${n+8}px">tinytrain @ 3f9c1e2</div></div></div>`;
  const hg=n=>hgAv("guide","idle static",n);
  h+=card("Page, 24px (installed)",hg(24),24)+card("Page, 20px",hg(20),20)+card("Page, 28px",hg(28),28)+
     card("B (before), 18px",im(B.small,18),18);
  h+=`</div><h2>Browser tabs, favicon at 16px</h2>`+tabs();
  out.innerHTML=h;
}else{
  let h=`<h1>Honey as the Honeyguide logo, with comb B for reference (${dark?"dark":"light"})</h1>
    <table><tr><th></th><th>96px</th><th>48px</th><th>32px</th><th>24px</th><th>18px</th><th>16px</th><th>24 / 18 / 16 px, ×6</th></tr>`;
  const row=(lab,sub,big,sm,z16)=>`<tr><td class="lab">${lab}<small>${sub}</small></td><td>${im(big,96)}</td><td>${im(big,48)}</td>`+
    `<td>${im(sm,32)}</td><td>${im(sm,24)}</td><td>${im(sm,18)}</td><td>${im(z16||sm,16)}</td>`+
    `<td><div class="zz">${zoom(sm,24)}${zoom(sm,18)}${zoom(z16||sm,16)}</div></td></tr>`;
  h+=row("Honey","icon (48px and up), icon-small (32px and below)",H.icon,H.small);
  h+=row("Honey favicon","favicon.svg: silhouette, eyes, satchel; no blush, mouth or shine",H.fav,H.fav);
  h+=row("Honey, full face at 16","icon-small shrunk to 16 (what the favicon would be unsimplified)",H.small,H.small);
  h+=row("B (before)","comb flower, now a secondary mark",B.icon,B.small,B.fav);
  h+=`</table><h2>Lockup (logo${s}.svg) at 96 and 40px tall: Honey, then B</h2><div class="lock">
    <img src="${H.logo}" height="96" alt="" style="margin:0"><img src="${H.logo}" height="40" alt="" style="margin:0">
    <img src="${B.logo}" height="40" alt="" style="margin:0"></div>
    <h2>Favicon in a tab strip, actual 16px</h2>`+tabs();
  out.innerHTML=h;
  for(const c of document.querySelectorAll("canvas")){
    const i=new Image(); i.onload=()=>{const x=c.getContext("2d");x.fillStyle=getComputedStyle(document.body).backgroundColor;
      x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);}; i.src=c.dataset.src;}
}
</script>
</body>
</html>
