<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Honeyguide logo, direction 1: path through the comb</title>
<!-- Comparison sheet for the four "path through the comb" drafts (a-d) beside the current refined bird.
     Open with ?theme=dark and/or ?view=context. The favicon column uses favicon.svg, which follows the OS theme
     (prefers-color-scheme), so render the dark sheet with Chrome's --force-dark-mode.
     The context view copies the page's .brand rule (src/honeyguide/page/page.css): 18px icon, 16px bold name. -->
<style>
:root{--bg:#F8F7F4;--ink:#24272B;--muted:#66717D;--line:#DDD9D1;--brand:#8F5A24;color-scheme:light;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
:root.dark{--bg:#171A20;--ink:#F0F1F3;--muted:#A5AAB5;--line:#3A3F49;--brand:#C98348;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:24px 28px}
h1{font-size:15px;margin:0 0 16px;font-weight:650}
table{border-collapse:collapse}
td,th{padding:10px 18px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}
td.lab{text-align:left;font-weight:600;white-space:nowrap;width:190px}
td.lab small{display:block;font-weight:400;color:var(--muted);white-space:normal}
img{display:block;margin:auto}
.cards{display:flex;gap:16px;flex-wrap:wrap}
.card{width:220px}
.cap{font-size:11px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.1em;font-weight:650}
.side{box-sizing:border-box;width:220px;padding:32px 20px 20px 28px;border:1px solid var(--line);border-radius:8px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.7}
.brand img{width:18px;height:18px;margin:0;flex:none}
.repo{font:12px var(--mono);color:var(--muted);margin:2px 0 8px 26px}
.tabs{display:flex;align-items:flex-end;gap:2px;background:var(--line);padding:8px 8px 0;border-radius:8px 8px 0 0;width:max-content;margin-top:6px}
.tab{display:flex;align-items:center;gap:8px;width:170px;height:34px;padding:0 12px;box-sizing:border-box;border-radius:8px 8px 0 0;font:12px var(--sans);color:var(--muted)}
.tab.on{background:var(--bg);color:var(--ink)}
.tab img{width:16px;height:16px;margin:0}
</style>
</head>
<body>
<div id="out"></div>
<script>
const q=new URLSearchParams(location.search), dark=q.get("theme")==="dark";
if(dark) document.documentElement.classList.add("dark");
const sfx=dark?"-dark":"";
// [key, name, what it says, icon, favicon, lockup]
const V=[
  ["a","A · Three cells","One curved trail in through an outer wall, across a shared wall, to a dot in the far cell",
    "a/icon"+sfx+".svg","a/favicon.svg","a/logo"+sfx+".svg"],
  ["b","B · Flower","Seven cells; the trail steps centre to centre and ends in a filled cell (favicon: the route as three lit cells)",
    "b/icon"+sfx+".svg","b/favicon.svg","b/logo"+sfx+".svg"],
  ["c","C · One cell","The trail enters through a wall and ends at the centre",
    "c/icon"+sfx+".svg","c/favicon.svg","c/logo"+sfx+".svg"],
  ["d","D · Lit cell","Two solid cells part; the trail rises through the gap into the lit cell above",
    "d/icon"+sfx+".svg","d/favicon.svg","d/logo"+sfx+".svg"],
  ["cur","Current","Refined bird (assets/), for reference",
    "../../icon"+sfx+".svg","../../favicon.svg","../../logo"+sfx+".svg"]];
const out=document.getElementById("out");
if(q.get("view")==="context"){
  let h=`<h1>In the page's sidebar brand row (${dark?"dark":"light"}), real size: 18px icon, 16px bold name</h1><div class="cards">`;
  for(const [,name,,icon] of V) h+=`<div class="card"><div class="cap">${name}</div><div class="side">
    <div class="brand"><img src="${icon}" alt="">honeyguide</div><div class="repo">tinytrain @ 3f9c1e2</div></div></div>`;
  h+=`</div><div style="margin-top:22px"><div class="cap">Browser tabs, favicon.svg at 16px</div><div class="tabs">`+
    V.map(([,name,,,fav],i)=>`<div class="tab${i==0?" on":""}"><img src="${fav}" alt="">${name}</div>`).join("")+"</div></div>";
  out.innerHTML=h;
}else{
  let h=`<h1>Honeyguide logo, direction 1: path through the comb (${dark?"dark":"light"})</h1>
    <table><tr><th></th><th>icon 96px</th><th>icon 32px</th><th>icon 16px</th><th>favicon 16px</th><th>wordmark lockup</th></tr>`;
  for(const [,name,sub,icon,fav,logo] of V)
    h+=`<tr><td class="lab">${name}<small>${sub}</small></td>`+
      [96,32,16].map(s=>`<td><img src="${icon}" width="${s}" height="${s}" alt=""></td>`).join("")+
      `<td><img src="${fav}" width="16" height="16" alt=""></td>`+
      `<td><img src="${logo}" height="40" alt=""></td></tr>`;
  out.innerHTML=h+"</table>";
}
</script>
</body>
</html>
