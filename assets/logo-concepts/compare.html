<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Honeyguide logo concepts</title>
<!-- Comparison sheet for the three logo concepts. Open with ?theme=dark and/or ?view=context.
     ?set=refined shows only the refined A (../logo.svg, ../icon.svg, ../favicon.svg) beside A original, the owl and the rabbit,
     and in the context view adds a browser-tab mock with the 16px favicon.
     The sidebar header copies the mockup's .side/.brand/.repo rules (mockup/index.html, v3) at their real size. -->
<style>
:root{--bg:#F8F7F4;--ink:#24272B;--muted:#66717D;--line:#E8E5DF;--brand:#8F5A24;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
:root.dark{--bg:#171A20;--ink:#F0F1F3;--muted:#A5AAB5;--line:#323741;--brand:#CD8C4E}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:24px 28px}
h1{font-size:15px;margin:0 0 16px;font-weight:650}
table{border-collapse:collapse}
td,th{padding:10px 18px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}
td.lab{text-align:left;font-weight:600;white-space:nowrap}
td.lab small{display:block;font-weight:400;color:var(--muted)}
img{display:block;margin:auto}
/* sidebar header, copied from the mockup */
.cards{display:flex;gap:16px;flex-wrap:wrap}
.card{width:220px}
.card .cap{font-size:11px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.1em;font-weight:650}
.side{box-sizing:border-box;width:220px;padding:32px 20px 20px 28px;border:1px solid var(--line);border-radius:8px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;line-height:1.7}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--brand);display:inline-block}
.brand img{width:var(--icon);height:var(--icon);margin:0}
.repo{font:12px var(--mono);color:var(--muted);margin:2px 0 8px calc(var(--icon) + 8px)}
/* browser tab strip mock (Chrome-like proportions) */
.tabs{display:flex;align-items:flex-end;gap:2px;background:var(--line);padding:8px 8px 0;border-radius:8px 8px 0 0;width:max-content;margin-top:20px}
.tab{display:flex;align-items:center;gap:8px;width:200px;height:34px;padding:0 12px;box-sizing:border-box;border-radius:8px 8px 0 0;font:12px var(--sans);color:var(--muted)}
.tab.on{background:var(--bg);color:var(--ink)}
.tab img{width:16px;height:16px;margin:0}
</style>
</head>
<body>
<div id="out"></div>
<script>
const q=new URLSearchParams(location.search), dark=q.get("theme")==="dark";
if(dark) document.documentElement.classList.add("dark");
const sfx=dark?"-dark":"";
const owl="../../../research-content-assistant/assets/logo"+sfx+".svg";
const rabbit="../../../repo-rabbit/assets/logo.svg";
const concepts=[
  ["A","Perched bird, hexagon eye","a/logo"+sfx+".svg"],
  ["B","Bird in flight, trail to a cell","b/logo"+sfx+".svg"],
  ["C","Bird perched on a cell","c/logo"+sfx+".svg"]];
const refined=q.get("set")==="refined";
const out=document.getElementById("out");
if(q.get("view")==="context"){
  let h=`<h1>In the mockup's sidebar header (${dark?"dark":"light"}), real size</h1><div class="cards">`;
  const card=(cap,icon,mark)=>`<div class="card"><div class="cap">${cap}</div><div class="side" style="--icon:${icon}px">
    <div class="brand">${mark}Honeyguide</div><div class="repo">tinytrain @ 3f9c1e2</div></div></div>`;
  h+=card("Today: honey dot",9,"<i></i>");
  if(refined){
    h+=card("A original at 18px",18,`<img src="a/logo${sfx}.svg" alt="">`);
    h+=card("A refined at 18px",18,`<img src="../icon${sfx}.svg" alt="">`);
    h+=card("Owl at 18px",18,`<img src="${owl}" alt="">`);
    const tab=(on,fav,t)=>`<div class="tab${on?" on":""}"><img src="${fav}" alt="">${t}</div>`;
    h+=`</div><div class="cards"><div><div class="cap" style="font-size:11px;color:var(--muted);margin:20px 0 0;text-transform:uppercase;letter-spacing:.1em;font-weight:650">Browser tabs, favicons at 16px</div><div class="tabs">`+
      tab(true,"../favicon.svg","Honeyguide · tinytrain")+
      tab(false,"../../../research-content-assistant/assets/favicon.svg","Review · post 8")+
      tab(false,"a/logo"+sfx+".svg","A original (as favicon)")+"</div></div>";
  }else for(const [k,,src] of concepts) for(const s of [18,16]) h+=card(`${k} at ${s}px`,s,`<img src="${src}" alt="">`);
  out.innerHTML=h+"</div>";
}else{
  let h=`<h1>Honeyguide ${refined?"logo, A refined,":"logo concepts"} beside the family (${dark?"dark":"light"})</h1><table><tr><th></th><th>140px</th><th>32px</th><th>16px</th></tr>`;
  const row=(lab,sub,src)=>h+=`<tr><td class="lab">${lab}<small>${sub}</small></td>`+
    [140,32,16].map(s=>`<td><img src="${src}" width="${s}" height="${s}" alt=""></td>`).join("")+"</tr>";
  row("Owl","research-content-assistant",owl);
  row("Rabbit",dark?"repo-rabbit (no dark variant exists)":"repo-rabbit",rabbit);
  if(refined){
    row("A original","Perched bird, hexagon eye","a/logo"+sfx+".svg");
    row("A refined","logo"+sfx+".svg","../logo"+sfx+".svg");
    row("A refined icon","icon"+sfx+".svg (small sizes)","../icon"+sfx+".svg");
    row("A refined favicon","favicon.svg (follows OS theme)","../favicon.svg");
  }else{
    for(const [k,d,src] of concepts) row("Concept "+k,d,src);
    row("A refined","Chosen concept, refined","../logo"+sfx+".svg");
  }
  out.innerHTML=h+"</table>";
}
</script>
</body>
</html>
