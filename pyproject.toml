[project]
name = "honeyguide"
version = "0.0.1"
description = "Claude Code subagents that learn a codebase into an interactive map, and an eval of whether the map pays off"
requires-python = ">=3.10"
dependencies = []   # the product's scripts are standard library only

[project.scripts]
honeyguide = "honeyguide.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honeyguide"]
